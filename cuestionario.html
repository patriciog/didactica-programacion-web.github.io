<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>Formulario de Autoevaluación</h1>
    <p>Comprueba tus conocimientos rellenando el siguiente test. Es necesario contestar a todas las preguntas.</p>
    
    <form id="formulario-evaluacion">
        <div class="grupo-form">
            <label for="nombre">1. Escribe tu nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre...">
        </div>

        <div class="grupo-form">
            <label>2. ¿Cuál es la función principal del lenguaje HTML según el material proporcionado?</label>
            <div>
                <input type="radio" id="q1-opt1" name="q1" value="a">
                <label for="q1-opt1" style="display:inline; font-weight:normal;">Funcionar como el esqueleto que estructura visualmente el contenido.</label>
            </div>
            <div>
                <input type="radio" id="q1-opt2" name="q1" value="b">
                <label for="q1-opt2" style="display:inline; font-weight:normal;">Definir los colores y estilos artísticos de la página.</label>
            </div>
            <div>
                <input type="radio" id="q1-opt3" name="q1" value="c">
                <label for="q1-opt3" style="display:inline; font-weight:normal;">Gestionar las bases de datos y la lógica del servidor.</label>
            </div>
            <div>
                <input type="radio" id="q1-opt4" name="q1" value="d">
                <label for="q1-opt4" style="display:inline; font-weight:normal;">Programar las interacciones complejas de los usuarios.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>3. ¿Qué característica define el funcionamiento básico de las etiquetas en HTML?</label>
            <div>
                <input type="radio" id="q2-opt1" name="q2" value="a">
                <label for="q2-opt1" style="display:inline; font-weight:normal;">Funcionan normalmente mediante etiquetas de apertura y cierre.</label>
            </div>
            <div>
                <input type="radio" id="q2-opt2" name="q2" value="b">
                <label for="q2-opt2" style="display:inline; font-weight:normal;">Requieren ser escritas siempre en mayúsculas obligatoriamente.</label>
            </div>
            <div>
                <input type="radio" id="q2-opt3" name="q2" value="c">
                <label for="q2-opt3" style="display:inline; font-weight:normal;">Deben ser todas de cierre automático sin excepción.</label>
            </div>
            <div>
                <input type="radio" id="q2-opt4" name="q2" value="d">
                <label for="q2-opt4" style="display:inline; font-weight:normal;">Se utilizan exclusivamente para insertar archivos de vídeo.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>4. ¿Cuál es la función específica de la etiqueta &lt;body&gt;?</label>
            <div>
                <input type="radio" id="q3-opt1" name="q3" value="a">
                <label for="q3-opt1" style="display:inline; font-weight:normal;">Actuar como el contenedor de todo el contenido visible de la página.</label>
            </div>
            <div>
                <input type="radio" id="q3-opt2" name="q3" value="b">
                <label for="q3-opt2" style="display:inline; font-weight:normal;">Almacenar únicamente los metadatos invisibles del documento.</label>
            </div>
            <div>
                <input type="radio" id="q3-opt3" name="q3" value="c">
                <label for="q3-opt3" style="display:inline; font-weight:normal;">Definir el título que aparece en la pestaña del navegador.</label>
            </div>
            <div>
                <input type="radio" id="q3-opt4" name="q3" value="d">
                <label for="q3-opt4" style="display:inline; font-weight:normal;">Funcionar como un enlace externo a otras páginas web.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>5. ¿Qué regla se aplica a la etiqueta &lt;body&gt; en una página estándar?</label>
            <div>
                <input type="radio" id="q4-opt1" name="q4" value="a">
                <label for="q4-opt1" style="display:inline; font-weight:normal;">Es obligatoria y debe ser única por página.</label>
            </div>
            <div>
                <input type="radio" id="q4-opt2" name="q4" value="b">
                <label for="q4-opt2" style="display:inline; font-weight:normal;">Se puede usar tantas veces como párrafos existan.</label>
            </div>
            <div>
                <input type="radio" id="q4-opt3" name="q4" value="c">
                <label for="q4-opt3" style="display:inline; font-weight:normal;">Es opcional si la página solo contiene imágenes.</label>
            </div>
            <div>
                <input type="radio" id="q4-opt4" name="q4" value="d">
                <label for="q4-opt4" style="display:inline; font-weight:normal;">Debe colocarse siempre dentro de una etiqueta de párrafo.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>6. ¿Cuál es el rango de la jerarquía de encabezados mencionada en el módulo?</label>
            <div>
                <input type="radio" id="q5-opt1" name="q5" value="a">
                <label for="q5-opt1" style="display:inline; font-weight:normal;">Desde &lt;h1&gt; hasta &lt;h6&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q5-opt2" name="q5" value="b">
                <label for="q5-opt2" style="display:inline; font-weight:normal;">Desde &lt;h0&gt; hasta &lt;h5Text&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q5-opt3" name="q5" value="c">
                <label for="q5-opt3" style="display:inline; font-weight:normal;">Solo existen las etiquetas &lt;h1&gt; y &lt;h2&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q5-opt4" name="q5" value="d">
                <label for="q5-opt4" style="display:inline; font-weight:normal;">Desde &lt;a&gt; hasta &lt;z&gt;.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>7. ¿Cuál es la recomendación respecto al uso de la etiqueta &lt;h1&gt;?</label>
            <div>
                <input type="radio" id="q6-opt1" name="q6" value="a">
                <label for="q6-opt1" style="display:inline; font-weight:normal;">Se recomienda utilizar solamente uno por página.</label>
            </div>
            <div>
                <input type="radio" id="q6-opt2" name="q6" value="b">
                <label for="q6-opt2" style="display:inline; font-weight:normal;">Debe repetirse al inicio de cada párrafo.</label>
            </div>
            <div>
                <input type="radio" id="q6-opt3" name="q6" value="c">
                <label for="q6-opt3" style="display:inline; font-weight:normal;">Es la etiqueta de menor importancia jerárquica.</label>
            </div>
            <div>
                <input type="radio" id="q6-opt4" name="q6" value="d">
                <label for="q6-opt4" style="display:inline; font-weight:normal;">Solo debe usarse en páginas que no tienen imágenes.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>8. ¿Qué etiqueta se utiliza para definir un párrafo estándar?</label>
            <div>
                <input type="radio" id="q7-opt1" name="q7" value="a">
                <label for="q7-opt1" style="display:inline; font-weight:normal;">La etiqueta &lt;p&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q7-opt2" name="q7" value="b">
                <label for="q7-opt2" style="display:inline; font-weight:normal;">La etiqueta &lt;h7&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q7-opt3" name="q7" value="c">
                <label for="q7-opt3" style="display:inline; font-weight:normal;">La etiqueta &lt;body&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q7-opt4" name="q7" value="d">
                <label for="q7-opt4" style="display:inline; font-weight:normal;">La etiqueta &lt;text&gt;.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>9. En la analogía del 'esqueleto', ¿qué representan los textos, imágenes y vídeos?</label>
            <div>
                <input type="radio" id="q8-opt1" name="q8" value="a">
                <label for="q8-opt1" style="display:inline; font-weight:normal;">El contenido visible que rellena la estructura.</label>
            </div>
            <div>
                <input type="radio" id="q8-opt2" name="q8" value="b">
                <label for="q8-opt2" style="display:inline; font-weight:normal;">Las etiquetas de apertura únicamente.</label>
            </div>
            <div>
                <input type="radio" id="q8-opt3" name="q8" value="c">
                <label for="q8-opt3" style="display:inline; font-weight:normal;">La parte invisible del código fuente.</label>
            </div>
            <div>
                <input type="radio" id="q8-opt4" name="q8" value="d">
                <label for="q8-opt4" style="display:inline; font-weight:normal;">El servidor donde se aloja la página.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>10. Si una página web tiene varios subtítulos de menor importancia que el título principal, ¿cuál de estas etiquetas sería la más adecuada para ellos?</label>
            <div>
                <input type="radio" id="q9-opt1" name="q9" value="a">
                <label for="q9-opt1" style="display:inline; font-weight:normal;">Las etiquetas entre &lt;h2&gt; y &lt;h6&gt;.</label>
            </div>
            <div>
                <input type="radio" id="q9-opt2" name="q9" value="b">
                <label for="q9-opt2" style="display:inline; font-weight:normal;">Nuevamente la etiqueta &lt;h1&gt; repetidas veces.</label>
            </div>
            <div>
                <input type="radio" id="q9-opt3" name="q9" value="c">
                <label for="q9-opt3" style="display:inline; font-weight:normal;">La etiqueta &lt;p&gt; para todos los casos.</label>
            </div>
            <div>
                <input type="radio" id="q9-opt4" name="q9" value="d">
                <label for="q9-opt4" style="display:inline; font-weight:normal;">Ninguna, los subtítulos no existen en HTML.</label>
            </div>
        </div>

        <div class="grupo-form">
            <label>11. ¿Cuál de los siguientes elementos se menciona como parte del contenido que puede albergar el contenedor principal?</label>
            <div>
                <input type="radio" id="q10-opt1" name="q10" value="a">
                <label for="q10-opt1" style="display:inline; font-weight:normal;">Imágenes y vídeos.</label>
            </div>
            <div>
                <input type="radio" id="q10-opt2" name="q10" value="b">
                <label for="q10-opt2" style="display:inline; font-weight:normal;">Reglas de base de datos SQL.</label>
            </div>
            <div>
                <input type="radio" id="q10-opt3" name="q10" value="c">
                <label for="q10-opt3" style="display:inline; font-weight:normal;">Protocolos de transferencia de archivos.</label>
            </div>
            <div>
                <input type="radio" id="q10-opt4" name="q10" value="d">
                <label for="q10-opt4" style="display:inline; font-weight:normal;">Sistemas operativos completos.</label>
            </div>
        </div>

        <div class="botones-form">
            <button type="button" class="accion" onclick="procesarFormulario()">Corregir Test</button>
            <button type="reset" class="accion" style="background-color:#666;" onclick="ocultarResultado()">Limpiar</button>
        </div>
    </form>

    <div id="resultado-evaluacion"></div>
    <script src="cuestionario.js"></script>
</body>
</html>
