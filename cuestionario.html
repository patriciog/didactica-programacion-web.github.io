<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Autoevaluación HTML/JS</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>Formulario de Autoevaluación</h1>
    <p>Comprueba tus conocimientos rellenando el siguiente test. Es necesario contestar a todas las preguntas.</p>
    
    <form id="formulario-evaluacion">
        <div class="grupo-form">
            <label for="nombre">Escribe tu nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre...">
        </div>

        <div class="grupo-form">
            <label>1. ¿Cuál es la función principal de la etiqueta &lt;body&gt;?</label>
            <div><input type="radio" name="q1" value="a"> Contener el contenido visible.</div>
            <div><input type="radio" name="q1" value="b"> Almacenar metadatos técnicos.</div>
        </div>

        <div class="grupo-form">
            <label>2. ¿Cómo deben usarse los encabezados &lt;h1&gt; a &lt;h6&gt;?</label>
            <div><input type="radio" name="q2" value="a"> De forma jerárquica por importancia.</div>
            <div><input type="radio" name="q2" value="b"> Según el tamaño de fuente deseado.</div>
        </div>

        <div class="grupo-form">
            <label for="q3">3. ¿Qué atributo HTML define el estilo en línea?</label>
            <select id="q3" name="q3">
                <option value="">-- Selecciona --</option>
                <option value="class">class</option>
                <option value="style">style</option>
            </select>
        </div>

        <div class="grupo-form">
            <label>4. ¿Cuáles son lenguajes válidos? (Marca los dos):</label>
            <div><input type="checkbox" name="q4" value="html"> HTML</div>
            <div><input type="checkbox" name="q4" value="python"> Python</div>
            <div><input type="checkbox" name="q4" value="vhs"> VHS</div>
        </div>

        <div class="grupo-form">
            <label for="q5">5. Selecciona las etiquetas que son de "autocierre" (Usa Ctrl/Cmd para elegir varias):</label>
            <select id="q5" name="q5" multiple size="4" style="width: 100%; max-width: 300px; display: block; margin-top: 10px;">
                <option value="img">&lt;img&gt;</option>
                <option value="div">&lt;div&gt;</option>
                <option value="br">&lt;br&gt;</option>
                <option value="p">&lt;p&gt;</option>
            </select>
        </div>

        <div class="botones-form">
            <button type="button" class="accion" onclick="procesarFormulario()">Corregir Test</button>
            <button type="reset" class="accion" style="background-color:#666;" onclick="ocultarResultado()">Limpiar</button>
        </div>
    </form>

    <div id="resultado-evaluacion" style="margin-top: 20px; padding: 15px; display: none; border-radius: 5px;"></div>

    <script src="cuestionario.js"></script>
</body>
</html>
